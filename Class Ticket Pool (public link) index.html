 const tp=ED?`<section class="panel"><h2>🔑 Teacher PIN</h2><div class="addrow"><input id="npin" type="password" inputmode="numeric" maxlength="8" placeholder="New PIN (4-8 digits)" data-enter="newtpin" aria-label="New teacher PIN"><button class="gold" data-act="newtpin">Change</button></div></section>`:"";
 app.innerHTML=head+ro+(FR?freePanel():"")+(DS?descPanel():"")+(T&&SC?codePanel():"")+tabs+stand+poolP+`<div class="cols">${ros}${card}</div>`+tp;
}
function softRender(){const p=$("pin"),u=$("uname"),pv=p?p.value:"",uv=u?u.value:"",a=document.activeElement,fid=a&&a.id;
 render();const p2=$("pin"),u2=$("uname");if(p2&&pv)p2.value=pv;if(u2&&uv)u2.value=uv;if(fid&&$(fid)&&$(fid).focus)$(fid).focus()}
function af(){const f=document.querySelector("[data-af]");if(f)f.focus()}
const UL={give:"Tickets added",poolgive:"Added to the class pool",redeem:"Prize redeemed",pick:"Birthday gift picked",reorder:"Order changed",movestu:"Student moved",usewin:"Reward updated",delp:"Item deleted",addp:"Item added",addc:"Class added",delc:"Class deleted",addstu:"Student added",delstu:"Student removed",genpin:"New PIN made",newtpin:"Teacher PIN changed"};
let UNDO=null,UT=null;
function hideUndo(){const u=$("undo");if(u)u.style.display="none";UNDO=null;clearTimeout(UT)}
function undoOffer(s,a){if(!UL[a])return;UNDO=s;$("undotxt").textContent=UL[a];$("undo").style.display="flex";clearTimeout(UT);UT=setTimeout(hideUndo,8000)}
function undoNow(){if(!UNDO)return;S=JSON.parse(UNDO);hideUndo();norm();sync();save();render();toast("Undone")}
async function run(a,d){
 const T=isT(),w=canAct(),c=curC(),stu=curS(),yr=new Date().getFullYear();
 if(a=="authtab"){authTab=d.t;authErr="";return render()}
 if(a=="showpin"){const n=($("uname")||{}).value||"",p=($("pin")||{}).value||"";SHOWPIN=!SHOWPIN;render();if($("uname"))$("uname").value=n;if($("pin"))$("pin").value=p;return}
 if(a=="signin"){const v=(($("pin")||{}).value||"").trim(),nm=(($("uname")||{}).value||"");
  if(authTab=="t"){if(await pinOk(v)){setSes({role:"t"});authErr=""}else authErr="That teacher PIN isn't right."}
  else{const hit=findStudent(nm,v);
   if(hit){setSes({role:"s",id:hit.s.id});CUR=hit.k.id;authErr=""}
   else if(!nm.trim()&&await pinOk(v)){setSes({role:"t"});authErr=""}
   else authErr="Name or PIN isn't right. Same first name as someone? Add your last initial."}
  return render()}
 if(a=="setup"){const v=(($("pin")||{}).value||"").trim();
  if(!/^\d{4,8}$/.test(v)){authErr="Use 4 to 8 digits.";return render()}
  S.tpin=await H(v);authErr="";setSes({role:"t"});save();return render()}
 if(a=="free"){FR=!FR;return render()}
 if(a=="rcls"){RCL=!RCL;return render()}
 if(a=="rstu"){RST=!RST;return render()}
 if(a=="desc"){DS=!DS;return render()}
 if(a=="paste"){PASTE=!PASTE;pasteErr="";return render()}
 if(a=="loadcode"){const o=readCode((($("pastebox")||{}).value));
  if(!o){pasteErr="That code doesn't look right. Copy the whole thing.";return render()}
  S=o;S.snap=true;norm();sync();setSes(null);ED=false;PASTE=false;authErr="";save();toast("Class loaded. Sign in with your PIN.");return render()}
 if(a=="logout"){hideUndo();setSes(null);ED=false;BD=false;CONF="";authErr="";return render()}
 if(!T)return;
 if(a=="dl"){const html=buildHTML(),name="class-ticket-pool.html";
  if(DL){try{await DL.save({filename:name,data:html});toast("Downloaded")}catch(e){toast("Download cancelled")}}
  else{const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));l.download=name;document.body.appendChild(l);l.click();l.remove();toast("Downloaded")}
  return}
 if(a=="code"){SC=!SC;return render()}
 if(a=="copycode"){const el=$("codebox");if(!el)return;el.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}toast(ok?"Copied!":"Press Ctrl+C (or Cmd+C) to copy");return}
 if(a=="tab"){CUR=+d.id;SEL=0;BD=false;CONF="";return render()}
 if(a=="stu"){SEL=+d.id;BD=false;CONF="";return render()}
 if(!w)return;
 if(a=="undo"){undoNow();return}
 const before=JSON.stringify(S);
 if(a=="edit"){ED=!ED;BD=false;CONF="";return render()}
 if(a=="give"){let n,why;
  if(d.p){const [l,i]=d.p.split(":"),x=LS(l)[i];if(!x)return;n=x.c;why=x.n}
  else{n=parseInt(($("amt")||{}).value);why=((($("sreason")||{}).value)||"").trim()}
  n=Math.min(500,n);if(!stu||!n||n<1){toast("Enter a number of tickets.");return}
  stu.e+=n;snote(stu,`+${n} tickets${why?": "+why:""}`)}
 else if(a=="bday"){if(!stu||stu.by==yr)return;BD=true;return render()}
 else if(a=="bcancel"){BD=false;return render()}
 else if(a=="pick"){const x=S.ind[d.i];if(!x||!stu||stu.by==yr)return;stu.by=yr;BD=false;snote(stu,`🎂 Birthday: free ${x.n}`);confetti()}
 else if(a=="redeem"){const x=LS(d.l)[d.i];if(!x)return;
  if(d.l=="P"){if(pool(c)<x.c)return}else if(!stu||stu.e-stu.sp<x.c)return;
  if(!ask(d.l+":"+d.i))return;
  if(d.l=="P"){c.spent+=x.c;note(c,`${c.name} redeemed ${x.n} (−${x.c})`)}else{stu.sp+=x.c;snote(stu,`Redeemed ${x.n} (−${x.c})`)}}
 else if(a=="poolgive"){let n,why;
  if(d.p){const [l,i]=d.p.split(":"),x=LS(l)[i];if(!x)return;n=x.c;why=x.n}
  else{n=parseInt(($("pamt")||{}).value);why=((($("preason")||{}).value)||"").trim()||"Class reward"}
  n=Math.min(500,n);if(!n||n<1){toast("Enter a number of tickets.");return}
  c.bonus+=n;note(c,`🎟️ +${n} to the class pool: ${why}`)}
 else if(a=="usewin"){const x=S.wins[d.i];if(!x)return;x.used=!x.used}
 else if(a=="delp")LS(d.l).splice(d.i,1);
 else if(a=="addp")LS(d.l).push(d.l=="C"||d.l=="S"?{n:"New reason",c:5}:{n:"New reward",c:50});
 else if(a=="addc"){const k={id:S.nid++,name:"New class",spent:0,log:[],st:[]};S.classes.push(k);CUR=k.id;SEL=0}
 else if(a=="delc"){if(S.classes.length<=1){toast("Keep at least one class.");return}if(!ask("C"+d.id))return;S.classes=S.classes.filter(k=>k.id!=d.id);SEL=0;norm()}
 else if(a=="addstu"){const el=$("newn"),n=(el.value||"").trim();if(!n)return;
  const s={id:S.nid++,n,e:0,sp:0,by:0,log:[],pin:newPin(usedPins())};c.st.push(s);SEL=s.id;el.value=""}
 else if(a=="delstu"){if(!stu||!ask("S"+stu.id))return;c.st=c.st.filter(s=>s.id!=stu.id);SEL=0}
 else if(a=="genpin"){if(stu)stu.pin=newPin(usedPins())}
 else if(a=="newtpin"){const v=(($("npin")||{}).value||"").trim();if(!/^\d{4,8}$/.test(v)){toast("Use 4 to 8 digits.");return}S.tpin=await H(v);toast("Teacher PIN changed.")}
 else return;
 save();render();undoOffer(before,a);
}
let DG=null;
document.addEventListener("pointerdown",e=>{const g=e.target.closest&&e.target.closest("[data-grip]");if(!g||!canAct())return;e.preventDefault();
 const q=g.dataset.grip.split(":");DG={l:q[0],i:+q[1],to:+q[1],before:JSON.stringify(S)};
 const r=g.closest("[data-row]");if(r)r.classList.add("drag");try{g.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener("pointermove",e=>{if(!DG)return;
 if(DG.l=="stu"){const el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.closest&&el.closest(".tab[data-id]");document.querySelectorAll(".tab.over").forEach(x=>x.classList.remove("over"));DG.tab=t?+t.dataset.id:0;if(t)t.classList.add("over");return}
const el=document.elementFromPoint(e.clientX,e.clientY),r=el&&el.closest&&el.closest("[data-row]");
 document.querySelectorAll(".chip.over").forEach(x=>x.classList.remove("over"));
 if(r){const q=r.dataset.row.split(":");if(q[0]==DG.l){DG.to=+q[1];r.classList.add("over")}}});
document.addEventListener("pointerup",()=>{if(!DG)return;const d=DG;DG=null;
 if(d.l=="stu"){if(d.tab&&d.tab!=CUR){const from=curC(),to=S.classes.find(k=>k.id==d.tab),s=from.st.find(x=>x.id==d.i);
  if(to&&s){from.st=from.st.filter(x=>x.id!=s.id);to.st.push(s);SEL=0;save();render();undoOffer(d.before,"movestu");toast(`Moved ${s.n} to ${to.name}`);return}}
  render();return}
 if(d.to!=d.i){const arr=LS(d.l),x=arr.splice(d.i,1)[0];arr.splice(d.to,0,x);save();render();undoOffer(d.before,"reorder")}else render()});
document.addEventListener("pointercancel",()=>{if(DG){DG=null;render()}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b&&!b.disabled)run(b.dataset.act,b.dataset)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.enter)run(e.target.dataset.enter,e.target.dataset)});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset,k=d.ch;if(!k||!canAct())return;
 if(k=="pn")LS(d.l)[d.i].n=t.value.trim()||"Reward";
 else if(k=="pc")LS(d.l)[d.i].c=Math.max(1,parseInt(t.value)||1);
 else if(k=="cn")S.classes.find(c=>c.id==d.id).name=t.value.trim()||"Class";
 else if(k=="sn")curS().n=t.value.trim()||"Student";
 else if(k=="se"){const s=curS(),v=Math.max(0,parseInt(t.value)||0);if(s&&v!=s.e){snote(s,`Total set to ${v} by a teacher`);s.e=v}}
 else if(k=="cb"){const c=curC(),v=Math.max(0,parseInt(t.value)||0);if(v!=c.bonus){note(c,`Class total set to ${v} by a teacher`);c.bonus=v}}
 else if(k=="pd")LS(d.l)[d.i].d=t.value.trim();
 else if(k=="fr")S.fr=t.value.trim()||"potluck";
 else if(k=="sp"){const s=curS(),v=t.value.trim();if(!/^\d{4}$/.test(v)||(usedPins().has(v)&&v!=s.pin)){toast("PIN must be 4 digits and not used by someone else.");render();return}s.pin=v}
 else return;save();render()});
window.addEventListener("error",e=>{try{toast("Error: "+(e.message||"something went wrong"))}catch(_){}});
window.addEventListener("unhandledrejection",e=>{try{toast("Error: "+((e.reason&&e.reason.message)||"something went wrong"))}catch(_){}});
render();
(async()=>{
 if(!INCL)return;
 try{
  const u=await claude.use("user");ART=await claude.use("artifact");DL=await claude.use("downloads");
  MODE="shared";canWrite=!!(ART&&u&&await u.canEdit());
  if(canWrite){try{const l=JSON.parse(localStorage.getItem(KEY)||"null");if(l&&l.classes&&(l.rev||0)>(S.rev||0)){S=l;norm()}}catch(e){}
   if((S.rev||0)>SEEDREV){clearTimeout(PT);PT=setTimeout(publishNow,2000)}}
  render()
 }catch(e){}
})();
</script></body></html>
